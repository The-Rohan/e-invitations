  @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400 600;font-display:swap;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#1E3B2F;font-family:'Manrope',ui-sans-serif,system-ui,sans-serif;overflow:hidden}

  /* ---- mobile (default): card fills the screen, no frame, no fake chrome ---- */
  .demo-device{position:fixed;inset:0}
  .demo-screen{position:absolute;inset:0;overflow:hidden;background:#F3EADA}
  .demo-viewport{position:absolute;inset:0;overflow:hidden;background:#F3EADA;container-type:inline-size}
  .demo-viewport iframe{width:100%;height:100%;border:0;display:block;opacity:1}
  .demo-frame,.demo-hint,.ios-status,.ios-safari{display:none}

  /* ---- mobile Book bar: the desktop "Buy this" lives in the mockup's Safari bar, which
     phones never show. Slides in once the guest is inside the card, never over the gate. ---- */
  .demo-book{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;
    width:min(340px,calc(100vw - 48px));display:flex;justify-content:center;opacity:0;pointer-events:none;
    transform:translate(-50%,140%);transition:opacity .3s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
  .demo-book.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .demo-book a{height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    text-decoration:none;box-shadow:0 10px 26px rgba(30,16,14,.30),0 2px 6px rgba(30,16,14,.18);
    -webkit-tap-highlight-color:transparent}
  .demo-book .go{flex:0 1 auto;min-width:230px;padding:0 30px;background:#A9573C;color:#FFF4F0;
    border:1px solid rgba(214,180,120,.55);
    font:600 .92rem/1 'Manrope',ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em}
  .demo-book .go:hover{background:#7A3B28}

  @media (max-width:759px){
    .demo-book{left:auto;right:14px;top:calc(72px + env(safe-area-inset-top));bottom:auto;width:auto;
      transform:translateY(-140%)}
    .demo-book.show{transform:none}
    .demo-book a{height:44px}
    .demo-book .go{min-width:0;padding:0 18px;font-size:.8rem}
  }

  /* ---- desktop: card inside the iPhone mockup ---- */
  @media (min-width:760px){
    .demo-book{display:none}
    body{overflow:auto}
    .demo-stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:20px;padding:26px 20px;
      background:
        radial-gradient(120% 90% at 50% -10%, #355A46 0%, #1E3B2F00 55%),
        radial-gradient(100% 100% at 50% 50%, #294A3A 0%, #1E3B2F 100%);}
    .demo-device{position:relative;height:min(90vh,860px);aspect-ratio:612/1258;
      filter:drop-shadow(0 50px 90px rgba(0,0,0,.6))}
    .demo-frame{display:block;position:absolute;inset:0;width:100%;height:100%;
      pointer-events:none;z-index:3}
    .demo-screen{position:absolute;left:7.03%;top:2.70%;width:86.11%;height:94.59%;
      border-radius:8.5%/4.2%;overflow:hidden;background:#F3EADA;z-index:1}

    /* the card only gets what is left between the two bars — as on a real phone */
    .demo-viewport{position:absolute;left:0;right:0;top:var(--statusH);bottom:var(--safariH);
      overflow:hidden;background:#F3EADA}
    .demo-viewport iframe{position:absolute;top:0;left:0;transform-origin:top left}

    /* ---------- iOS status bar ---------- */
    .ios-status{display:flex;position:absolute;top:0;left:0;right:0;height:var(--statusH);
      z-index:2;align-items:center;justify-content:space-between;
      padding:2px calc(var(--u) * 3.2) 0;
      background:#F3EADA;color:#000000;
      font-family:-apple-system,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
      font-size:calc(var(--u) * 1.02);font-weight:600;letter-spacing:.01em}
    .ios-status .sbIcons{display:flex;align-items:center;gap:calc(var(--u) * .38);transform:translateX(3px)}
    .ios-status svg{display:block;height:calc(var(--u) * .84);width:auto}
    .ios-status svg.wifi{height:calc(var(--u) * .924)}

    /* ---------- Safari bottom bar ---------- */
    .ios-safari{display:block;position:absolute;left:0;right:0;bottom:0;height:var(--safariH);
      z-index:2;background:#F7F6F8;border-top:1px solid rgba(0,0,0,.10);
      padding:calc(var(--u) * .62) calc(var(--u) * .72) 0;
      font-family:-apple-system,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif}
    .ios-safari .row{display:flex;align-items:center;gap:calc(var(--u) * .5)}

    .ios-safari .urlbar{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
      gap:calc(var(--u) * .34);height:calc(var(--u) * 2.05);padding:0 calc(var(--u) * .7);
      border-radius:calc(var(--u) * .62);background:#E4E3E9;color:#1C1C1E;
      text-decoration:none;font-size:calc(var(--u) * .96);letter-spacing:.005em;
      transition:background .18s ease}
    .ios-safari .urlbar:hover{background:#DAD9E0}
    .ios-safari .urlbar .aA{font-size:calc(var(--u) * .78);opacity:.55;flex:none}
    .ios-safari .urlbar .lock{height:calc(var(--u) * .8);width:auto;flex:none;opacity:.6}
    .ios-safari .urlbar .host{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .ios-safari .buy{flex:none;display:flex;align-items:center;
      height:calc(var(--u) * 2.05);padding:0 calc(var(--u) * .92);
      border-radius:calc(var(--u) * .62);background:#A9573C;color:#FFF4F0;
      text-decoration:none;font-size:calc(var(--u) * .93);font-weight:600;
      letter-spacing:.01em;white-space:nowrap;
      box-shadow:0 1px 3px rgba(0,0,0,.28);transition:background .18s ease}
    .ios-safari .buy:hover{background:#7A3B28}

    .ios-safari .homebar{width:36%;height:calc(var(--u) * .18);margin:calc(var(--u) * .6) auto 0;
      border-radius:99px;background:rgba(0,0,0,.32)}

    .demo-hint{display:block;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;
      color:rgba(244,237,224,.58)}
    .demo-hint b{font-weight:600;color:rgba(232,210,160,.9);letter-spacing:.2em}

  }

<script>
  /* Desktop only: render the card at a true mobile width, then scale it to fit the
     screen area left between the status bar and the Safari bar. The chrome is sized
     off the screen WIDTH (not height) so its proportions match a real iPhone at any
     stage size — 54pt status and 88pt Safari against a 430pt-wide screen. */
  (function(){
    var BASE = 402;                     /* the card's intended mobile width */
    var screen   = document.getElementById('screen'),
        frame    = document.getElementById('frame'),
        viewport = screen.querySelector('.demo-viewport');

    function fit(){
      if(window.innerWidth < 760){
        screen.style.removeProperty('--statusH');
        screen.style.removeProperty('--safariH');
        frame.style.cssText = 'width:100%;height:100%;border:0;transform:none';
        return;
      }
      var w = screen.clientWidth;
      screen.style.setProperty('--u',       (w / 24.4)   + 'px');   /* chrome type scale */
      screen.style.setProperty('--statusH', (w * 0.1256) + 'px');   /* 54pt / 430pt */
      screen.style.setProperty('--safariH', (w * 0.2047) + 'px');   /* 88pt / 430pt */

      var h = viewport.clientHeight, s = w / BASE;
      frame.style.width     = BASE + 'px';
      frame.style.height    = (h / s) + 'px';
      frame.style.transform = 'scale(' + s + ')';
    }
    fit();
    var t; addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(fit, 150); });

    /* Mobile Book bar: show once the guest has scrolled about a screen into the card
       (scroll events from any element inside it), or 25 s after it is ready. */
    var book = document.getElementById('book'), moved = 0, lastY = new WeakMap(), watched = null;
    function showBook(){
      if(book.classList.contains('show')) return;
      book.classList.add('show');
    }
    function watchScroll(){
      try{
        var doc = frame.contentDocument;
        if(!doc || doc === watched) return;
        watched = doc;
        doc.addEventListener('scroll', function(e){
          var el = e.target.scrollingElement || e.target, y = el.scrollTop || 0;
          moved += Math.abs(y - (lastY.get(el) || 0)); lastY.set(el, y);
          if(moved > innerHeight * .8) showBook();
        }, {capture:true, passive:true});
      }catch(_){}
    }
    frame.addEventListener('load', watchScroll);
    var watchPoll = setInterval(function(){ watchScroll(); if(watched) clearInterval(watchPoll); }, 250);
    setTimeout(showBook, 25000);
  })();

</script>
