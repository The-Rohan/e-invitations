<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sehra-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05241b"/>
      <stop offset="50%" stop-color="#0a3c2e"/>
      <stop offset="100%" stop-color="#02140f"/>
    </linearGradient>
    <linearGradient id="sehra-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8a8"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#f5dc8c"/>
      <stop offset="100%" stop-color="#9a741a"/>
    </linearGradient>
    <radialGradient id="sehra-pearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e8e2d5"/>
      <stop offset="100%" stop-color="#b8ae9c"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;display=swap');
      .crest-s { font-family: 'Cinzel', 'Fraunces', 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 31px; }
    </style>
  </defs>

  <!-- Luxury Octagonal Emerald Jewel Shield -->
  <polygon points="32,2 53,8 62,28 57,51 32,62 7,51 2,28 11,8" fill="url(#sehra-bg)" stroke="url(#sehra-gold)" stroke-width="1.6"/>
  <polygon points="32,5.5 50,10.8 58,28 53.8,48 32,58 10.2,48 6,28 14,10.8" fill="none" stroke="url(#sehra-gold)" stroke-width="0.75" opacity="0.45"/>

  <!-- Celestial 4-Point Radiant Crown Star -->
  <polygon points="32,8.5 33.3,12.2 37,13.4 33.3,14.6 32,18.2 30.7,14.6 27,13.4 30.7,12.2" fill="url(#sehra-gold)"/>

  <!-- Bespoke Typographic Monogram "S" -->
  <text x="32" y="44" class="crest-s" text-anchor="middle" fill="url(#sehra-gold)" letter-spacing="-0.02em">S</text>

  <!-- Bottom Pearl Accent -->
  <circle cx="32" cy="51.5" r="2.2" fill="url(#sehra-pearl)"/>
  <circle cx="32" cy="51.5" r="2.2" fill="none" stroke="url(#sehra-gold)" stroke-width="0.7" opacity="0.8"/>
</svg>