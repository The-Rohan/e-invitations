<style data-from="/css/try-flow.css">/* ==========================================================================
   The "Edit this design" popup.

   One component, opened from anywhere a design is offered -- the homepage's
   Quick Look, a design's own page, the /try/<design> address a WhatsApp
   message can carry. It is drawn for a phone first (most people who buy a card
   here are holding one) and grows into a centred dialog on a large screen.

   Self-contained on purpose: its own variables and its own reset inside .tf,
   so the marketing theme, the panel and the landing bundle can all load it
   without either restyling the other. The colours are Quick Look's.
   ========================================================================== */

.tf {
  --tf-ink: #2b211d;
  --tf-ink-soft: rgba(43, 33, 29, .62);
  --tf-maroon: #5a1621;
  --tf-coral: #6d5119;
  --tf-gold: #a8842f;
  --tf-cream: #f3ece4;
  --tf-paper: #fffdfa;
  --tf-line: rgba(90, 22, 33, .16);
  --tf-bad: #b3402c;
  --tf-ok: #1f7a4c;
  /* One typeface, the homepage's (2026-10-22). */
  --tf-serif: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --tf-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --tf-mono: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

  position: fixed;
  inset: 0;
  z-index: 2147483000;
  display: none;
  font-family: var(--tf-sans);
  color: var(--tf-ink);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
:where(.tf), :where(.tf) *, :where(.tf) *::before, :where(.tf) *::after { box-sizing: border-box; }
:where(.tf) :where(button, input) { font: inherit; color: inherit; }
:where(.tf) svg { display: block; }
.tf.is-open { display: block; }

html.tf-lock, html.tf-lock body { overflow: hidden; }
html.tf-lock body { position: fixed; left: 0; right: 0; width: 100%; }

/* ------------------------------------------------------------- the frame */
.tf-back {
  position: absolute;
  inset: 0;
  background: rgba(38, 10, 18, .58);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity .28s ease;
}
.tf.is-in .tf-back { opacity: 1; }

.tf-sheet {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--tf-top, 0px);
  height: var(--tf-h, 100dvh);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(168, 132, 47, .16), transparent 60%),
    var(--tf-paper);
  transform: translateY(28px);
  opacity: 0;
  transition: transform .38s cubic-bezier(.2, .9, .25, 1), opacity .28s ease;
}
.tf.is-in .tf-sheet { transform: none; opacity: 1; }

@media (min-width: 721px) {
  .tf-sheet {
    left: 50%;
    right: auto;
    top: 50%;
    width: min(540px, 94vw);
    height: min(780px, 92vh);
    border-radius: 30px;
    box-shadow: 0 40px 100px -30px rgba(38, 10, 18, .7);
    transform: translate(-50%, -46%);
  }
  .tf.is-in .tf-sheet { transform: translate(-50%, -50%); }
}

/* ------------------------------------------------------------------ top */
.tf-top {
  flex: none;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  padding: max(12px, env(safe-area-inset-top)) 12px 6px;
}
.tf-icon-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  color: var(--tf-ink);
  transition: background .15s;
}
.tf-icon-btn:hover { background: rgba(90, 22, 33, .08); }
.tf-icon-btn:focus-visible, .tf-btn:focus-visible, .tf-chip:focus-visible, .tf-pack:focus-visible {
  outline: 2px solid var(--tf-coral);
  outline-offset: 2px;
}
.tf-icon-btn[hidden] { display: block; visibility: hidden; }

.tf-prog { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tf-track {
  position: relative;
  flex: 1;
  height: 8px;
  border-radius: 99px;
  background: rgba(90, 22, 33, .11);
}
.tf-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--tf-maroon), var(--tf-coral) 70%, var(--tf-gold));
  transition: width .55s cubic-bezier(.2, .8, .2, 1);
}
.tf-fill::after {
  content: "";
  position: absolute;
  right: -1px;
  top: 50%;
  width: 14px;
  height: 14px;
  margin-top: -7px;
  border-radius: 50%;
  background: var(--tf-paper);
  border: 3px solid var(--tf-coral);
  box-shadow: 0 2px 6px rgba(90, 22, 33, .3);
}
.tf-pct {
  flex: none;
  min-width: 52px;
  text-align: right;
  font: 700 15px/1 var(--tf-mono);
  letter-spacing: .02em;
  color: var(--tf-maroon);
  font-variant-numeric: tabular-nums;
}

/* ----------------------------------------------------------------- body */
.tf-body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 10px 20px 20px;
}
.tf-view { animation: tf-in .42s cubic-bezier(.2, .8, .2, 1) both; }
.tf-view.is-back { animation-name: tf-in-back; }
/* A change inside a screen is not a new screen: no slide. */
.tf-view.is-still { animation: none; }
@keyframes tf-in { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
@keyframes tf-in-back { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }

.tf-title {
  margin: 4px 0 16px;
  font-family: var(--tf-serif);
  font-weight: 500;
  font-size: clamp(34px, 9vw, 44px);
  line-height: .98;
  letter-spacing: -.02em;
}
.tf-title em { font-style: italic; color: var(--tf-maroon); }
.tf-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 6px;
  font: 700 11.5px/1 var(--tf-mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--tf-coral);
}
.tf-eyebrow::before { content: ""; width: 20px; height: 1px; background: currentColor; opacity: .6; }

/* ---------------------------------------------------------------- inputs */
.tf-stack { display: grid; gap: 12px; }
.tf-field { position: relative; display: block; }
.tf-field > svg {
  position: absolute;
  left: 15px;
  top: 50%;
  width: 20px;
  height: 20px;
  margin-top: -10px;
  color: var(--tf-maroon);
  opacity: .7;
  pointer-events: none;
}
.tf-input {
  width: 100%;
  height: 54px;
  padding: 0 16px;

  /* --------------------------------------------------------------- opening */
  function seenKey() {
    var card = S && S.st && S.st.urls && S.st.urls.card || '';
    var v = /v=([a-f0-9]+)/.exec(card);
    return 'tf:seen:' + S.key + ':' + (v ? v[1] : '');
  }
  /* A pack chosen in Quick Look is remembered for the payment sheet, which is
     two pages further on. */
  function remember(what, key, value) { try { sessionStorage.setItem('tf:' + what + ':' + key, value); } catch (e) { /* private mode */ } }
  function recall(what, key) { try { return sessionStorage.getItem('tf:' + what + ':' + key) || ''; } catch (e) { return ''; } }

  function hasSeen() { try { return localStorage.getItem(seenKey()) === '1'; } catch (e) { return false; } }
  function markSeen() { try { localStorage.setItem(seenKey(), '1'); } catch (e) { /* private mode */ } }

  /* The popup's first screen needs the visitor's saved state, and asking for
     it only once the popup is open leaves a spinner on screen. It is asked for
     as a finger or pointer comes down on the button that opens it -- a moment
     before the click -- and kept for a short while for open() to pick up. */
  var early = {};
  function prefetch(key) {
    if (!key || (early[key] && Date.now() - early[key].at < 15000)) return;
    early[key] = { at: Date.now(), p: api('/try/api/state?key=' + enc(key)) };
  }
  function stateFor(key) {
    var hit = early[key];
    delete early[key];
    if (hit && Date.now() - hit.at < 15000) return hit.p;
    return api('/try/api/state?key=' + enc(key));
  }

  function open(key, opts) {
    opts = opts || {};
    S = fresh(key);
    S.page = !!opts.page;
    S.edit = !!opts.edit;
    S.buy = !!opts.buy;
    S.colors = opts.colors || null;
    if (opts.tier) remember('tier', key, opts.tier);
    try { sessionStorage.setItem('tf:last', key); } catch (e) { /* private mode */ }
    show();
    dropLoad();
    push(1);
    $('#tfBody').innerHTML = '<div class="tf-view" style="display:grid;place-items:center;height:60%"><div class="tf-spin" style="border-color:rgba(90,22,33,.2);border-top-color:#5a1621;width:30px;height:30px"></div></div>';
    $('#tfFoot').innerHTML = '';
    setProgress(0);
    track('try_open', { item_id: key, where: opts.page ? 'page' : 'popup' });

    stateFor(key).then(function (st) {
      if (!st.ok) { fail(st.error === 'design' ? T.noPrice : T.trouble); return; }
      S.st = st;
      S.answers = clone(st.draft && st.draft.answers);
      S.contact.email = (st.draft && st.draft.email) || (st.user && st.user.email) || '';
      S.contact.whatsapp = (st.draft && st.draft.whatsapp) || (st.user && st.user.whatsapp) || '';
      if (!st.template.sellable) { fail(T.noPrice); return; }

      var d = st.draft;

      /* They came with a colour the saved card does not have. Everything else
         is known, so it is saved on its own and they go straight on. */
      var have = d && d.answers && d.answers.colors, want = S.colors;
      if (d && d.complete && !S.edit && want && (!have || have.primary !== want.primary || have.secondary !== want.secondary)) {
        S.contact.email = d.email; S.contact.whatsapp = d.whatsapp;
        S.step = 3;
        submitContact();
        return;
      }

      // Buying, with everything already known: straight to payment.
      if (S.buy && d && d.complete && !S.edit) { toPay(); return; }

      if (d && d.complete && !S.edit) {
        // Everything is known. If they have already seen this card there is
        // nothing to wait for; otherwise it is the loading moment they came for.
        if (hasSeen()) { leave(st.urls.preview); return; }
        startLoad();
        return;
      }
      S.step = S.edit ? 1 : Math.max(1, Math.min(d ? d.step : 1, 3));
      if (S.step > 1 && !hasNames()) S.step = 1;
      S.mode = 'flow';
      paint();
    });
  }

  function hasNames() {
    var a = S.answers, sc = S.st.schema;
    return (a.groomName || '').length > 1 && (sc.single || (a.brideName || '').length > 1);
  }

  function fail(text) {
    $('#tfBody').innerHTML = '<div class="tf-view tf-center"><h2 class="tf-title">' + esc(text) + '</h2></div>';
    $('#tfFoot').innerHTML = '<button type="button" class="tf-btn is-ghost" data-act="close">' + T.close + '</button>';
  }

  /* --------------------------------------------------------------- drawing */
  function dropLoad() {
    var l = root && root.querySelector('.tf-load');
    if (l && l.parentNode) l.parentNode.removeChild(l);
  }

  /* `still` redraws the same screen where it stands, with no slide-in: for the
     little changes inside a screen (opening the "other" box, showing more
     functions) that must not look like the page was reloaded. */
  function paint(still) {
    if (!S || !S.st) return;
    dropLoad();
    var body = $('#tfBody'), foot = $('#tfFoot');
    var anim = still === true ? 'tf-view is-still' : (S.back ? 'tf-view is-back' : 'tf-view');
    var html, label, icon;

    $('[data-act=back]').hidden = false;
    $('[data-act=back]').style.visibility = (S.mode === 'flow' && S.step === 1) ? 'hidden' : 'visible';

    if (S.mode === 'pay') {
      html = payHtml();
      body.innerHTML = '<div class="' + anim + '">' + html + '</div>';
      foot.innerHTML = payFoot();
      setProgress(100);
      bindPay();
      return;
    }

    if (S.step === 1) { html = stepNames(); label = T.next; icon = 'right'; }
    else if (S.step === 2) { html = stepEvents(); label = T.next; icon = 'right'; }
    else { html = stepContact(); label = S.buy ? T.toPay : T.view; icon = S.buy ? 'lock' : 'eye'; }

    var keepAt = still === true ? body.scrollTop : 0;
    body.innerHTML = '<div class="' + anim + '">' + html + '</div>';
    body.scrollTop = keepAt;
    foot.innerHTML = '<button type="button" class="tf-btn" data-act="primary" id="tfPrimary">' +
      (S.step === 3 ? svg(icon) + esc(label) : esc(label) + svg(icon)) + '</button>';
    S.back = false;
    setProgress(progressNow());
    syncButton();
    later(function () { var f = $('[data-focus]'); if (f) f.focus({ preventScroll: true }); }, 380);
  }

  function err(key) {
    if (!S.errors[key]) return '';
    var said = S.errors[key] === 'invalid' ? T.invalid : (S.errors[key] === 'short' ? T.pwShort : T.required);
    return '<p class="tf-err">' + esc(said) + '</p>';
  }
  /* A password is asked of somebody who is not signed in, until one is on
     their draft (2026-10-02) -- the account made at payment uses it. */
  function needsPw() {
    return !S.st.user && !(S.st.draft && S.st.draft.hasPassword);
  }
  function bad(key) { return S.errors[key] ? ' is-bad' : ''; }

  function person(kind, badge, label, ids, ph, opts) {
    var a = S.answers, sc = S.st.schema;
    var full = kind === 'g' ? a.groomName : a.brideName;
    var short = kind === 'g' ? a.groomShort : a.brideShort;
    var fam = kind === 'g' ? a.groomFamily : a.brideFamily;
    return '<div class="tf-person">' +
      '<div class="tf-person-head"><span class="tf-badge' + (kind === 'b' ? ' is-b' : '') + '">' + svg(badge) + '</span>' +
      '<span class="tf-person-name">' + esc(label) + '</span></div>' +
      '<div class="tf-pair">' +
        '<div><input class="tf-input' + bad(ids.full) + '" id="f-' + ids.full + '" data-k="' + ids.full + '" ' + (opts.focus ? 'data-focus ' : '') +
          'value="' + esc(full || '') + '" placeholder="' + esc(ph.full) + '" maxlength="60" autocomplete="name" autocapitalize="words" enterkeyhint="next">' + err(ids.full) + '</div>' +
        '<div><input class="tf-input" id="f-' + ids.short + '" data-k="' + ids.short + '" value="' + esc(short || '') + '" placeholder="' + esc(ph.short) + '" maxlength="30" autocapitalize="words" enterkeyhint="next"></div>' +
      '</div>' +
      (opts.age
        ? '<label class="tf-field">' + svg('cake') + '<input class="tf-input" id="f-turning" data-k="turning" value="' + esc(a.turning || '') + '" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="' + esc(T.turning) + '" enterkeyhint="done"></label>'
        : '') +
      (sc.family && !opts.noFamily
        ? '<label class="tf-field">' + svg('users') + '<input class="tf-input" id="f-' + ids.fam + '" data-k="' + ids.fam + '" value="' + esc(fam || '') + '" placeholder="' + esc(ph.fam) + '" maxlength="70" autocapitalize="words" enterkeyhint="' + (opts.last ? 'done' : 'next') + '"></label>'
        : '') +
    '</div>';
  }

  function stepNames() {
    var sc = S.st.schema;
    if (sc.single) {
      return '<h2 class="tf-title">' + T.star + '</h2><div class="tf-stack">' +
        person('g', 'sparkles', T.celebrant, { full: 'groomName', short: 'groomShort', fam: 'groomFamily' },
          { full: T.groomFull, short: T.groomFirst, fam: '' }, { focus: true, noFamily: true, age: sc.age }) + '</div>';
    }
    return '<h2 class="tf-title">' + T.couple + '</h2><div class="tf-stack">' +
      person('g', 'user', T.groom, { full: 'groomName', short: 'groomShort', fam: 'groomFamily' },
        { full: T.groomFull, short: T.groomFirst, fam: T.groomFamily }, { focus: true }) +
      person('b', 'user', T.bride, { full: 'brideName', short: 'brideShort', fam: 'brideFamily' },
        { full: T.brideFull, short: T.brideFirst, fam: T.brideFamily }, { last: true }) +
    '</div>';
  }

  function chosen(id, name) {
    var list = S.answers.events || [];
    for (var i = 0; i < list.length; i += 1) {
      if (id ? list[i].type === id : (!list[i].type && list[i].name === name)) return i;
    }
    return -1;
  }

  function chipsHtml() {
    var sc = S.st.schema, list = S.answers.events || [];
    var shown = S.more ? sc.events : sc.events.slice(0, 9);
    var chips = shown.map(function (e) {
      var on = chosen(e.id) > -1;
      return '<button type="button" class="tf-chip' + (on ? ' is-on' : '') + '" data-act="ev" data-id="' + esc(e.id) + '" aria-pressed="' + on + '">' + eventIcon(e.id) + esc(e.name) + '</button>';
    }).join('');
    // Events they typed themselves stay visible as chips, chosen.
    list.filter(function (e) { return !e.type; }).forEach(function (e) {
      chips += '<button type="button" class="tf-chip is-on" data-act="ev-custom" data-name="' + esc(e.name) + '" aria-pressed="true">' + svg('sparkles') + esc(e.name) + '</button>';
    });
    if (!S.more && sc.events.length > 9) chips += '<button type="button" class="tf-chip is-more" data-act="more">' + svg('dots') + T.more + '</button>';
    if (!sc.noCustom) chips += '<button type="button" class="tf-chip is-more" data-act="other">' + svg('plus') + T.other + '</button>';
    return chips;
  }

  /* Choosing or dropping a function changes the chips and the date rows and
     nothing else, so that is all that is touched. The whole screen used to be
     drawn again, which slid it in from the side and popped every date row in
     afresh -- each tap looked like the page had reloaded. */
  function refreshEvents(newAt) {
    var chips = $('.tf-chips'), dates = $('#tfDates');
    if (!chips || !dates) { paint(true); return; }
    chips.innerHTML = chipsHtml();
    var note = $('.tf-view > .tf-err');
    if (note && note.parentNode) note.parentNode.removeChild(note);
    S.newRow = newAt;
    dates.innerHTML = dateRows();
    S.newRow = -1;
    setProgress(progressNow());
    syncButton();
  }

  function stepEvents() {
    var sc = S.st.schema, list = S.answers.events || [];
    if (sc.fixedEvent) {
      if (!list.length) { S.answers.events = list = [{ type: sc.events[0].id, name: sc.events[0].name, date: '' }]; }
      return '<h2 class="tf-title">' + T.date + '</h2><div class="tf-dates">' + dateRows() + '</div>';
    }

    return '<h2 class="tf-title">' + T.events + '</h2>' +
      '<div class="tf-chips">' + chipsHtml() + '</div>' +
      (S.other ? '<div class="tf-add"><input class="tf-input" id="tfOther" placeholder="' + esc(T.otherName) + '" maxlength="40" autocapitalize="words" enterkeyhint="done">' +
        '<button type="button" class="tf-btn" data-act="other-add" aria-label="Add">' + svg('check') + '</button></div>' : '') +
      err('events') +
      '<div class="tf-dates" id="tfDates">' + dateRows() + '</div>';
  }

  function today() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

  function dateRows() {
    var list = S.answers.events || [];
    return list.map(function (e, i) {
      var badRow = S.errors['events.' + i + '.date'];
      return '<div class="tf-date' + (badRow ? ' is-bad' : '') + (i === S.newRow ? ' is-new' : '') + '">' +
        '<div class="tf-date-name">' + eventIcon(e.type) + '<span>' + esc(e.name) + '</span></div>' +
        '<input type="date" class="tf-input' + (badRow ? ' is-bad' : '') + '" data-date="' + i + '" value="' + esc(e.date || '') + '" min="' + today() + '" aria-label="' + esc(e.name) + '">' +
      '</div>';
    }).join('');
  }

  function stepContact() {
    var a = S.answers, sc = S.st.schema, user = S.st.user;
    var names = sc.single
      ? (a.groomShort || a.groomName || '')
      : [a.groomShort || (a.groomName || '').split(' ')[0], a.brideShort || (a.brideName || '').split(' ')[0]].filter(Boolean).join(' & ');
    var cover = S.st.template.cover;

    return '<div class="tf-center">' +
      '<div class="tf-tease" aria-hidden="true"><div class="tf-tease-screen">' +
        (cover ? '<img src="https://ceremoniainvites.com/try/'&#32;+&#32;esc(cover)&#32;+&#32;'" alt="" decoding="async">' : '') +
        '<span class="tf-tease-lock">' + svg('lock') + '</span>' +
        '<div class="tf-tease-names">' + esc(names) + '</div>' +
      '</div></div>' +
      '<h2 class="tf-title">' + (S.buy ? T.buyReady : T.ready) + '</h2>' +
      '<p class="tf-sub">' + (user ? '' : (S.buy ? T.buySub : T.readySub)) + '</p>' +
      '</div>' +
      '<div class="tf-stack">' +
        /* Only the WhatsApp number (2026-10-27). Pakistani by default; "Not
           in Pakistan?" adds a country code beside it. */
        '<div><label class="tf-field' + (S.contact.intl ? ' tf-field-intl' : '') + '">' + svg('chat') +
          (S.contact.intl ? '<input class="tf-input tf-cc" data-c="cc" type="tel" inputmode="tel" autocomplete="tel-country-code" maxlength="5" value="' + esc(S.contact.cc) + '" placeholder="' + esc(T.cc) + '" aria-label="Country code">' : '') +
          '<input class="tf-input' + bad('whatsapp') + '" data-c="whatsapp" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="done" data-focus ' +
          'value="' + esc(S.contact.whatsapp) + '" placeholder="' + esc(S.contact.intl ? T.whatsappIntl : T.whatsapp) + '" maxlength="24" aria-describedby="tfPhoneMsg"></label>' +
          '<p class="tf-err" id="tfPhoneMsg" role="alert"' + (S.errors.whatsapp ? '' : ' hidden') + '>' + esc(S.errors.whatsapp ? (S.contact.intl ? T.phoneIntlBad : T.phoneBad) : '') + '</p>' +
          '<button type="button" class="tf-code-link tf-intl-link" data-act="intl">' + esc(S.contact.intl ? T.inPk : T.notPk) + '</button></div>' +
        '<input class="tf-hp" tabindex="-1" autocomplete="off" aria-hidden="true" data-hp>' +
      '</div>' +
      '<p class="tf-fine">' + svg('shield') + esc(T.fine) + '</p>';
  }

  /* An input that was marked wrong stops being marked once it is being fixed. */
  function clearBad(input) {
    input.classList.remove('is-bad');
    var holder = input.closest('.tf-field') || input.parentNode;
    var note = holder && holder.parentNode && holder.parentNode.querySelector('.tf-err');
    if (holder && holder.nextElementSibling && holder.nextElementSibling.classList.contains('tf-err')) note = holder.nextElementSibling;
    else if (input.nextElementSibling && input.nextElementSibling.classList.contains('tf-err')) note = input.nextElementSibling;
    else note = null;
    if (note && note.parentNode) note.parentNode.removeChild(note);
  }

  /* ---------------------------------------------------------------- events */
  function firstWord(v) { return String(v || '').trim().split(/\s+/)[0] || ''; }
  // The short name is still the copy of the full name's first word, not one they chose.
  function stillCopy(sk) {
    if (S.dirtyShort[sk]) return false;
    var full = S.answers[sk === 'groomShort' ? 'groomName' : 'brideName'];
    var v = String(S.answers[sk] || '');
    return Boolean(v) && v === firstWord(full);
  }
  function onInput(e) {
    var t = e.target;
    if (!t || !S) return;

    if (t.hasAttribute('data-k')) {
      var k = t.getAttribute('data-k');
      /* The short name, still the copy of the full one: the first thing typed
         into it replaces the copy rather than joining it, wherever the caret
         was -- typing "Hamza" into a box that already said "Hamza" made
         "HamzaHamza" (2026-10-13). Deleting from it edits it as usual. */
      if ((k === 'groomShort' || k === 'brideShort') && stillCopy(k)) {
        var was = String(S.answers[k] || '');
        var added = t.value.length - was.length;
        var at = typeof t.selectionStart === 'number' ? t.selectionStart : t.value.length;
        if (was && added > 0 && at >= added) {
          var typed = t.value.slice(at - added, at);
          if (t.value === was.slice(0, at - added) + typed + was.slice(at - added)) {
            t.value = typed;
            try { t.setSelectionRange(typed.length, typed.length); } catch (err) { /* fine */ }
          }
        }
      }
      var before = String(S.answers[k] || '');
      S.answers[k] = t.value;
      if (S.errors[k]) { delete S.errors[k]; clearBad(t); }
      /* The short name follows the full one until they type in it -- and only
         while it is still the copy (or empty): a short name of their own, from
         an earlier visit to this draft, is never overwritten. */
      if (k === 'groomName' || k === 'brideName') {
        var sk = k === 'groomName' ? 'groomShort' : 'brideShort';
        var shortNow = String(S.answers[sk] || '');
        if (!S.dirtyShort[sk] && (!shortNow || shortNow === firstWord(before))) {
          var first = t.value.trim().split(/\s+/)[0] || '';
          S.answers[sk] = first;
          var other = $('#f-' + sk);
          if (other) other.value = first;
        }
      } else if (k === 'groomShort' || k === 'brideShort') {
        S.dirtyShort[k] = true;
      }
      setProgress(progressNow());
      syncButton();
    } else if (t.hasAttribute('data-c')) {
      var ck = t.getAttribute('data-c');
      S.contact[ck] = t.value;
      if (ck === 'whatsapp' || ck === 'cc') { delete S.errors.whatsapp; phoneHint(); }
      else if (S.errors[ck]) { delete S.errors[ck]; clearBad(t); }
      setProgress(progressNow());
      syncButton();
    } else if (t.hasAttribute('data-date')) {
      dateChanged(Number(t.getAttribute('data-date')), t.value);
    } else if (t.id === 'tfCode') {
      S.pay.code = t.value;
    } else if (t.id === 'tfPayEmail' || t.id === 'tfPayPw') {
      S.pay[t.id === 'tfPayEmail' ? 'email' : 'newPw'] = t.value;
      var ek = t.id === 'tfPayEmail' ? 'email' : 'password';
      if (S.pay.errors && S.pay.errors[ek]) { delete S.pay.errors[ek]; clearBad(t); }
    } else if (t.id === 'tfExistingPw') {
      S.pay.password = t.value;
      if (S.pay.passwordErr) { S.pay.passwordErr = ''; clearBad(t); }
    }
  }

  /* The first date fills the rest in, a day apart -- most functions run on
     consecutive days -- and each can still be changed. */
  function dateChanged(i, value) {
    var list = S.answers.events;
    list[i].date = value;
    var row = $$('.tf-date')[i]; if (row) row.classList.remove('is-bad');
    if (value) {
      var prev = new Date(value + 'T12:00:00Z');
      for (var j = i + 1; j < list.length; j += 1) {
        if (list[j].date) break;
        prev = new Date(prev.getTime() + 86400000);
        list[j].date = prev.toISOString().slice(0, 10);
        var input = $$('[data-date]')[j]; if (input) input.value = list[j].date;
      }
    }
    setProgress(progressNow());
    syncButton();
  }

  function onClick(e) {
    var t = e.target.closest('[data-act], .tf-pack, .tf-switch, [data-tier]');
    if (!t || !S) return;
    var act = t.getAttribute('data-act');

    if (act === 'close') return close();
    if (act === 'back') { if (S.mode === 'pay') return close(); return history.back(); }
    if (act === 'primary') return primary();
    if (act === 'more') { S.more = true; return keepScroll(function () { paint(true); }); }
    if (act === 'intl') {
      S.contact.intl = !S.contact.intl;
      delete S.errors.whatsapp;
      paint(true);
      later(function () { var f = $(S.contact.intl ? '[data-c="cc"]' : '[data-c="whatsapp"]'); if (f) f.focus(); }, 50);
      return;
    }
    if (act === 'other') { S.other = true; paint(true); later(function () { var o = $('#tfOther'); if (o) o.focus(); }, 50); return; }
    if (act === 'other-add') return addOther();
    if (act === 'ev') return toggleEvent(t.getAttribute('data-id'));
    if (act === 'ev-custom') return dropCustom(t.getAttribute('data-name'));
    if (act === 'pay-go') return payGo();
    if (act === 'pay-email') { S.pay.notice = ''; S.pay.password = ''; S.pay.passwordErr = ''; S.pay.error = ''; keepScroll(paint); later(function () { var f = $('#tfPayEmail'); if (f) f.focus(); }, 50); return; }
    if (act === 'code-open') { S.pay.codeOpen = true; paint(true); later(function () { var c = $('#tfCode'); if (c) c.focus(); }, 50); return; }
    if (act === 'code-apply') { return refreshQuote(false, false); }
    if (t.hasAttribute('data-tier')) { S.pay.tier = t.getAttribute('data-tier'); return refreshQuote(false, true); }
    if (act === 'setup') { S.pay.setup = !S.pay.setup; return refreshQuote(false, true); }
  }

  function toggleEvent(id) {
    var sc = S.st.schema, list = S.answers.events = S.answers.events || [];
    var at = chosen(id);
    if (at > -1) list.splice(at, 1);
    else {
      if (list.length >= sc.maxEvents) return;
      var def = sc.events.filter(function (x) { return x.id === id; })[0];
      list.push({ type: id, name: def ? def.name : id, date: '' });
      // A new function takes the day after the last one, when that is known.
      var before = list[list.length - 2];
      if (before && before.date) {
        list[list.length - 1].date = new Date(new Date(before.date + 'T12:00:00Z').getTime() + 86400000).toISOString().slice(0, 10);
      }
    }
    delete S.errors.events;
    refreshEvents(at > -1 ? -1 : list.length - 1);
  }

  function dropCustom(name) {
    var list = S.answers.events || [];
    S.answers.events = list.filter(function (e) { return e.type || e.name !== name; });
    delete S.errors.events;
    refreshEvents(-1);
  }

  function addOther() {
    var input = $('#tfOther');
    var name = input ? input.value.trim().slice(0, 40) : '';
    if (!name) { if (input) input.classList.add('is-bad'); return; }
    var list = S.answers.events = S.answers.events || [];
    var added = -1;
    if (list.length < S.st.schema.maxEvents) { list.push({ type: '', name: name, date: '' }); added = list.length - 1; }
    S.other = false;
    var box = $('.tf-add');
    if (box && box.parentNode) box.parentNode.removeChild(box);
    delete S.errors.events;
    refreshEvents(added);
  }

  function keepScroll(fn) {
    var b = $('#tfBody'), y = b ? b.scrollTop : 0;
    fn();
    if (b) b.scrollTop = y;
  }

  /* --------------------------------------------------------------- moving on */
  function primary() {
    if (!S || S.busy) return;
    if (S.mode === 'pay') return payGo();
    if (!isValid()) return;
    if (S.step === 1) return saveNames();
    if (S.step === 2) return saveEvents();
    return saveContact();
  }

  function busy(on) {
    S.busy = on;
    var b = $('#tfPrimary') || $('#tfPay');
    if (!b) return;
    b.disabled = on;
    if (on) { b.setAttribute('data-html', b.innerHTML); b.innerHTML = '<span class="tf-spin"></span>'; }
    else if (b.getAttribute('data-html')) b.innerHTML = b.getAttribute('data-html');
    if (!on) syncButton();
  }

  function mark(errors) {
    S.errors = errors || {};
    paintErrors();
  }
  function paintErrors() {
    var keep = $('#tfBody').scrollTop;
    paint(true);
    $('#tfBody').scrollTop = keep;
    var first = $('.is-bad');
    if (first && first.focus) { try { first.focus({ preventScroll: false }); } catch (e) { first.focus(); } }
  }

  /* What went wrong, said under the button. Only for a failure that is not the
     visitor's to fix on a field -- a dropped connection, a busy server. */
  function troubleLine(r) {
    var f = $('#tfFoot');
    if (!f || $('.tf-err-line')) return;
    var p = document.createElement('p');
    p.className = 'tf-err tf-err-line';
    p.style.textAlign = 'center';
    p.textContent = r && r.error === 'slow-down' ? T.slow : T.trouble;
    f.insertBefore(p, f.firstChild);
  }

  /* Nobody waits between screens.

     The first two screens are checked here and the visitor moves straight on;
     what they entered is sent in the background, one save after another so the
     server always sees them in order. It is still saved as they go, so leaving
     halfway and coming back finds their names -- it just never holds anybody
     up. Whatever has not landed by the last screen is sent again there, behind
     the loading screen, where waiting is what the screen is for. */
  function stash(step, payload) {
    payload.key = S.key; payload.step = step; payload.website = '';
    if (S.colors) payload.colors = S.colors;
    var slot = { payload: payload, r: null };
    S.sent = S.sent || {};
    S.sent[step] = slot;
    S.saves = (S.saves || Promise.resolve())
      .then(function () { return api('/try/api/save', payload); })
      .then(function (r) { slot.r = r; });
  }

  /* Everything still owed to the server, in order, ending with the contact
     details. Resolves {ok:true, r} with the last answer, or {ok:false, step, r}
     naming the screen that has to be put right. */
  function finish(honeypot) {
    return (S.saves || Promise.resolve()).then(function () {
      var chain = Promise.resolve({ ok: true });
      [1, 2].forEach(function (step) {
        chain = chain.then(function (prev) {
          var slot = S.sent && S.sent[step];
          if (!prev.ok || !slot || (slot.r && slot.r.ok)) return prev;
          // Did not land -- a dropped connection, say -- so once more, here.
          return api('/try/api/save', slot.payload).then(function (r) {
            slot.r = r;
            return r.ok ? prev : { ok: false, step: step, r: r };
          });
        });
      });
      return chain;
    }).then(function (prev) {
      if (!prev.ok) return prev;
      // The number, already made dialable; nothing else is asked here.
      var payload = { key: S.key, step: 3, whatsapp: phoneOf().e164 || S.contact.whatsapp, website: honeypot || '' };
      if (S.colors) payload.colors = S.colors;
      return api('/try/api/save', payload).then(function (r) { return r.ok ? { ok: true, r: r } : { ok: false, step: 3, r: r }; });
    });
  }

  function saveNames() {
    var a = S.answers, sc = S.st.schema, errs = {};
    if ((a.groomName || '').trim().length < 2) errs.groomName = 'required';
    if (!sc.single && (a.brideName || '').trim().length < 2) errs.brideName = 'required';
    if (Object.keys(errs).length) return mark(errs);
    S.errors = {};

    stash(1, {
      groomName: a.groomName, groomShort: a.groomShort, groomFamily: a.groomFamily,
      brideName: a.brideName, brideShort: a.brideShort, brideFamily: a.brideFamily,
      turning: a.turning
    });
    track('try_step', { item_id: S.key, step: 1 });
    go(2);
  }

  function saveEvents() {
    var list = S.answers.events || [], errs = {};
    if (!list.length) errs.events = 'required';
    list.forEach(function (e, i) { if (!e.date) errs['events.' + i + '.date'] = 'required'; });
    if (Object.keys(errs).length) return mark(errs);
    S.errors = {};

    stash(2, { events: list });
    track('try_step', { item_id: S.key, step: 2 });
    // A signed-in customer whose number we already hold has nothing left to
    // be asked: straight to their card.
    if (S.st.user && S.st.user.hasWhatsapp && !S.edit) {
      S.contact.whatsapp = S.st.user.whatsapp;
      return submitContact();
    }
    go(3);
  }

  function saveContact() {
    var errs = {};
    if (!phoneOf().ok) errs.whatsapp = 'invalid';
    if (Object.keys(errs).length) { S.errors = errs; phoneHint(); var f = $('[data-c="whatsapp"]'); if (f) f.focus(); return; }
    S.errors = {};
    submitContact();
  }

  /* The loading screen comes up at once, and the saving happens behind it --
     unless they are buying, when the save happens under the button and the
     payment sheet follows. */
  function submitContact() {
    if (S.submitting) return;
    S.submitting = true;
    var hp = $('[data-hp]');
    if (S.buy) {
      busy(true);
      finish(hp ? hp.value : '').then(function (res) {
        S.submitting = false;
        busy(false);
        if (!res.ok) { backFromLoad(res); return; }
        S.st.urls = res.r.urls;
        S.st.draft = res.r.draft;
        track('Lead', { content_name: S.key, content_category: 'guest_buy' });
        toPay();
      });
      return;
    }
    startLoad(finish(hp ? hp.value : '').then(function (res) {
      S.submitting = false;
      if (res.ok) {
        S.st.urls = res.r.urls;
        S.st.draft = res.r.draft;
        track('Lead', { content_name: S.key, content_category: 'guest_try' });
      }
      return res;
    }));
  }

  /* A save behind the loading screen was refused: back to the screen it is
     about, with the reason where they can see it. */
  function backFromLoad(res) {
    clearTimers();
    dropLoad();
    var r = res.r || {};
    S.mode = 'flow';
    S.step = r.error === 'start' ? 1 : (res.step || 3);
    S.errors = (r.status === 422 && r.errors) ? r.errors : {};
    paint();
    if (Object.keys(S.errors).length) {
      var first = $('.is-bad');
      if (first && first.focus) { try { first.focus(); } catch (e) { /* nothing to focus */ } }
    } else if (r.error !== 'start') {
      troubleLine(r);
    }
  }

  function go(n) {
    S.step = n; S.mode = 'flow';
    push(n);
    paint();
  }

  /* --------------------------------------------------------------- the wait */
  var SEEN_MIN = 5000, SEEN_MAX = 8000;

  /* The loading moment.

     It is theatre with a job. Their card takes a few seconds to arrive -- its
     pictures and type have to come down a phone connection -- and this is
     where that happens, in a hidden frame, so the page that follows opens on a
     card that is already there instead of half drawn. It ends when the card
     has loaded and at least five seconds have passed, and never later than
     eight. */
  function startLoad(pending) {
    clearTimers();
    S.mode = 'load';
    push('load');
    $('[data-act=back]').style.visibility = 'hidden';
    setProgress(100);

    var sparks = '';
    for (var i = 0; i < 14; i += 1) {
      sparks += '<i class="tf-spark" style="left:' + (6 + Math.random() * 88).toFixed(1) + '%;bottom:' + (8 + Math.random() * 50).toFixed(1) +
        '%;animation-delay:' + (Math.random() * 5).toFixed(2) + 's;animation-duration:' + (3.6 + Math.random() * 3).toFixed(1) + 's"></i>';
    }
    var R = 54, C = 2 * Math.PI * R;
    var heads = HEADINGS.map(function (h, i) { return '<span data-h="' + i + '"' + (i === 0 ? ' class="is-on"' : '') + '>' + esc(h) + '</span>'; }).join('');

    var body = $('#tfBody');
    body.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'tf-load';
    box.innerHTML = sparks +
      '<div class="tf-ring"><svg viewBox="0 0 120 120"><defs><linearGradient id="tfGrad" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#f3ece4"/><stop offset="1" stop-color="#a8842f"/></linearGradient></defs>' +
      '<circle class="bg" cx="60" cy="60" r="' + R + '"/><circle class="fg" cx="60" cy="60" r="' + R + '" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '"/></svg>' +
      '<div class="tf-ring-num"><span id="tfLoadNum">1</span><small>%</small></div></div>' +
      '<div class="tf-load-head" id="tfHeads">' + heads + '</div>' +
      '<div class="tf-load-bar"><i id="tfLoadBar"></i></div>';
    root.querySelector('.tf-sheet').appendChild(box);
    $('#tfFoot').innerHTML = '';

    var frame = document.createElement('iframe');
    frame.className = 'tf-load-frame';
    frame.setAttribute('aria-hidden', 'true');
    frame.tabIndex = -1;
    var ready = false, saved = !pending, savedAt = 0, aborted = false;
    frame.addEventListener('load', function () { ready = true; });
    frame.addEventListener('error', function () { ready = true; });
    box.appendChild(frame);
    /* With a save still to finish, the card's address is not known yet: the
       bar is already moving, and the card starts arriving the moment it is. */
    if (!pending) frame.src = S.st.urls.card;
    else {
      pending.then(function (res) {
        if (aborted) return;
        if (!res.ok) { aborted = true; backFromLoad(res); return; }
        saved = true; savedAt = performance.now();
        frame.src = S.st.urls.card;
      });
    }

    var t0 = performance.now(), shown = 0, finishing = 0, from = 1, last = 0, navigated = false;
    var num = $('#tfLoadNum'), ring = $('.tf-ring .fg'), bar = $('#tfLoadBar');
    var ease = function (x) { return 1 - Math.pow(1 - x, 2.2); };

    function draw(p) {
      var v = Math.max(1, Math.min(100, Math.floor(p)));
      num.textContent = v;
      ring.style.strokeDashoffset = (C * (1 - v / 100)).toFixed(2);
      bar.style.width = v + '%';
      var idx = Math.min(HEADINGS.length - 1, Math.floor(v / 100 * HEADINGS.length));
      if (idx !== shown) {
        var spans = $$('#tfHeads span');
        spans[shown].classList.remove('is-on'); spans[idx].classList.add('is-on');
        shown = idx;
      }
    }

    (function tick(now) {
      if (aborted) return;
      var el = now - t0, p;
      if (!finishing) {
        if (el < SEEN_MIN) p = 1 + ease(el / SEEN_MIN) * 91;
        else p = Math.min(98, 92 + ((el - SEEN_MIN) / (SEEN_MAX - SEEN_MIN)) * 6);
        last = p;
        /* Never finishes before everything is saved -- the bar holds at 98 if
           that is slow. Once it is saved the card gets up to three more
           seconds to arrive if the clock has already run out. */
        var lateEnough = el >= SEEN_MAX && (!savedAt || now - savedAt >= 3000);
        if (saved && ((el >= SEEN_MIN && ready) || lateEnough)) { finishing = now; from = p; }
      }
      if (finishing) {
        var f = Math.min(1, (now - finishing) / 450);
        p = from + (100 - from) * f;
        if (f >= 1 && !navigated) {
          navigated = true;
          draw(100);
          markSeen();
          later(function () { leave(S.st.urls.preview); }, 260);
          return;
        }
      }
      draw(p);
      S.raf = requestAnimationFrame(tick);
    })(t0);
  }

  /* ------------------------------------------------------- add-ons and pay */
  function openPay(key) {
    S = fresh(key);
    S.mode = 'pay';
    S.pay.tier = recall('tier', key) || 'none';
    try { sessionStorage.setItem('tf:last', key); } catch (e) { /* private mode */ }
    show();
    dropLoad();
    push('pay');
    $('#tfBody').innerHTML = '<div class="tf-view" style="display:grid;place-items:center;height:60%"><div class="tf-spin" style="border-color:rgba(90,22,33,.2);border-top-color:#5a1621;width:30px;height:30px"></div></div>';
    $('#tfFoot').innerHTML = '';
    $('[data-act=back]').style.visibility = 'hidden';
    setProgress(100);
    /* No InitiateCheckout on opening this sheet: that is looking at prices,
       not starting to pay. It fires from payGo, when they go on into
       checkout (see initiated()). */

    /* The state and the first quote are asked for together: the second does not
       depend on the first, and one after the other was two waits behind one
       spinner. */
    var seq = S.pay.seq = 1;
    Promise.all([stateFor(key), api(quoteQuery())]).then(function (both) {
      var st = both[0];
      if (!st.ok || !st.template.sellable) { S.st = st; return fail(T.noPrice); }
      S.st = st;
      if (!st.draft || !st.draft.complete) {
        // Nothing to buy yet: start where they are.
        S.mode = 'flow'; S.answers = clone(st.draft && st.draft.answers);
        S.step = Math.max(1, Math.min(st.draft ? st.draft.step : 1, 3));
        return paint();
      }
      settleQuote(both[1], seq, true);
    });
  }

  /* From the questions straight to the payment sheet, on the plan they chose
     before they began. */
  function toPay() {
    S.mode = 'pay';
    S.pay.tier = recall('tier', S.key) || S.pay.tier || 'none';
    if (!S.pay.email && S.st && S.st.draft && S.st.draft.email) S.pay.email = S.st.draft.email;
    push('pay');
    $('#tfBody').innerHTML = '<div class="tf-view" style="display:grid;place-items:center;height:60%"><div class="tf-spin" style="border-color:rgba(90,22,33,.2);border-top-color:#5a1621;width:30px;height:30px"></div></div>';
    $('#tfFoot').innerHTML = '';
    setProgress(100);
    var seq = S.pay.seq = (S.pay.seq || 0) + 1;
    api(quoteQuery()).then(function (r) { settleQuote(r, seq, true); });
  }

  function quoteQuery() {
    return '/try/api/quote?key=' + enc(S.key) + '&tier=' + enc(S.pay.tier) + '&setup=' + (S.pay.setup ? '1' : '0') +
      (S.pay.code.trim() ? '&code=' + enc(S.pay.code.trim()) : '');
  }

  /* `inPlace`: a pack or the set-up switch changed. The price is worked out
     here at once from the numbers the quote already carries, and only the bits
     that changed are touched; the server's answer follows to confirm it and
     the screen is left alone unless it disagrees. Nothing waits, and nothing
     slides in again. */
  function refreshQuote(first, inPlace) {
    remember('tier', S.key, S.pay.tier);
    remember('setup', S.key, S.pay.setup ? '1' : '0');
    remember('code', S.key, S.pay.code.trim());
    if (window.CIContext) window.CIContext.refresh({ key: S.key, tier: S.pay.tier, setup: S.pay.setup ? '1' : '0', code: S.pay.code.trim() });
    if (inPlace) { repriceLocal(); syncPay(); }
    var seq = S.pay.seq = (S.pay.seq || 0) + 1;
    return api(quoteQuery()).then(function (r) { settleQuote(r, seq, first, inPlace); });
  }

  function settleQuote(r, seq, first, inPlace) {
    if (seq !== S.pay.seq) return; // a newer choice is already on its way
    if (!r.ok) { S.pay.error = r.error === 'no-price' ? T.noPrice : T.trouble; }
    else { S.pay.quote = r.quote; S.pay.tier = r.quote.chosen; S.pay.setup = r.quote.withSetup; S.pay.error = ''; }
    S.mode = 'pay';
    if (first) return paint();
    if (inPlace && r.ok) {
      /* Only if the server priced it differently from what is showing does
         anything change on screen. */
      syncPay();
      return;
    }
    keepScroll(function () { paint(true); });
  }

  function money(n, cur) {
    return cur === 'PKR' ? 'PKR ' + Number(n).toLocaleString('en-PK') : '$' + Number(n).toLocaleString('en-US');
  }

  function repriceLocal() {
    var q = S.pay.quote;
    if (!q || typeof q.base !== 'number') return;
    var pk = q.packs.filter(function (p) { return p.key === S.pay.tier; })[0];
    if (!pk) return;
    var sub = q.base + (pk.add || 0) + (S.pay.setup ? (q.setup || 0) : 0);
    var pct = q.percent || 0;
    var off = pct >= 100 ? sub : (pct > 0 ? Math.floor(sub * pct / 100) : 0);
    q.chosen = S.pay.tier; q.withSetup = S.pay.setup;
    q.subtotal = sub; q.discount = off; q.total = sub - off; q.totalText = money(q.total, q.currency);
  }

  function totalHtml(q) {
    return (q.discount ? '<s>' + esc(money(q.subtotal, q.currency)) + '</s>' : '') + esc(q.totalText);
  }

  /* Puts what the quote says onto the screen that is already there. */
  function syncPay() {
    var q = S.pay.quote;
    if (!q) return;
    $$('.tf-pack').forEach(function (b) {
      var on = b.getAttribute('data-tier') === q.chosen;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var sw = $('.tf-switch');
    if (sw) { sw.classList.toggle('is-on', q.withSetup); sw.setAttribute('aria-pressed', q.withSetup ? 'true' : 'false'); }
    var tot = $('.tf-total strong');
    if (tot) tot.innerHTML = totalHtml(q);
    var pay = $('#tfPay');
    if (pay && !S.busy && S.pay.notice !== 'exists') pay.innerHTML = svg('lock') + esc(T.pay) + ' &middot; ' + esc(q.totalText);
  }

  function payHtml() {
    var q = S.pay.quote, tpl = S.st.template;
    if (!q) return '';
    /* The two plans, side by side: name, price (the original struck
       through), and one line on what it is. */
    var packs = q.packs.map(function (p) {
      return '<button type="button" class="tf-pack tf-plan' + (p.key === q.chosen ? ' is-on' : '') + '" data-tier="' + esc(p.key) + '" aria-pressed="' + (p.key === q.chosen) + '">' +
        '<span class="tf-plan-name">' + esc(p.name || '') + '</span>' +
        '<span class="tf-plan-price">' + (p.wasText ? '<s><span class="sr-only">Was </span>' + esc(p.wasText) + '</s> ' : '') + esc(p.priceText || '') + '</span>' +
        '<span class="tf-plan-line">' + esc(p.line || '') + '</span></button>';
    }).join('');

    var codeBlock = S.pay.codeOpen
      ? '<div class="tf-code"><input class="tf-input" id="tfCode" value="' + esc(S.pay.code) + '" placeholder="' + T.codePh + '" autocapitalize="characters" autocomplete="off" spellcheck="false">' +
        '<button type="button" class="tf-btn" data-act="code-apply">' + T.apply + '</button></div>' +
        (q.codeError ? '<p class="tf-err">' + esc(q.codeError) + '</p>' : (q.code ? '<p class="tf-ok">' + esc(q.code) + ' &minus;' + q.percent + '%</p>' : ''))
      : '<button type="button" class="tf-code-link" data-act="code-open">' + svg('tag') + T.code + '</button>';

    return '<div class="tf-price"><span class="tf-price-name">' + esc(tpl.name) + '</span></div>' +
      '<div class="tf-h">' + svg('link') + T.links + '</div><div class="tf-packs">' + packs + '</div>' +
      '<div class="tf-h">' + svg('wand') + '</div>' +
      '<button type="button" class="tf-switch' + (q.withSetup ? ' is-on' : '') + '" data-act="setup" aria-pressed="' + q.withSetup + '">' +
        '<span class="tf-switch-ic">' + svg('wand') + '</span><span class="tf-switch-name">' + T.setup + '</span>' +
        '<span class="tf-switch-price">' + esc(q.setupText) + '</span><span class="tf-toggle"></span></button>' +
      codeBlock +
      askLink() +
      accountBlock() +
      '<div class="tf-total"><span>' + T.total + '</span><strong>' + totalHtml(q) + '</strong></div>' +
      orderWaLink() +
      (S.pay.notice === 'exists'
        ? '<div class="tf-notice">' +
            '<p>' + esc(S.pay.passwordErr ? T.wrongPw : T.existsPw) + '</p>' +
            '<label class="tf-field">' + svg('lock') + '<input class="tf-input' + (S.pay.passwordErr ? ' is-bad' : '') + '" id="tfExistingPw" type="text" inputmode="numeric" maxlength="6" ' +
              'value="' + esc(S.pay.password) + '" placeholder="6-digit code" autocomplete="one-time-code" enterkeyhint="done" data-focus></label>' +
            (needsAccount() ? '<button type="button" class="tf-code-link" data-act="pay-email">' + esc(T.otherEmail) + '</button>' : '') +
          '</div>'
        : '') +
      (S.pay.error ? '<div class="tf-notice is-bad"><p>' + esc(S.pay.error) + '</p>' + askLink().replace(' style="margin-left:14px"', '') + '</div>' : '');
  }

  /* The account, made here at checkout (2026-10-27): an email and a password
     for somebody not signed in. An email that turns out to have an account
     is asked for its 6-digit code instead (the notice below the total). */
  function needsAccount() { return !(S.st && S.st.user); }
  function needsNewPw() { return !(S.st.draft && S.st.draft.hasPassword); }
  function accountBlock() {
    if (!needsAccount() || S.pay.notice === 'exists') return '';
    var e = S.pay.errors || {};
    var say = function (k) { return e[k] ? '<p class="tf-err">' + esc(k === 'email' ? T.emailBad : (e[k] === 'short' ? T.pwShort : T.required)) + '</p>' : ''; };
    return '<div class="tf-h">' + svg('lock') + T.accountH + '</div>' +
      '<div class="tf-stack tf-account">' +
        '<div><label class="tf-field">' + svg('mail') + '<input class="tf-input' + (e.email ? ' is-bad' : '') + '" id="tfPayEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="120" ' +
          'value="' + esc(S.pay.email) + '" placeholder="' + esc(T.email) + '"></label>' + say('email') + '</div>' +
        (needsNewPw() ? '<div><label class="tf-field">' + svg('lock') + '<input class="tf-input' + (e.password ? ' is-bad' : '') + '" id="tfPayPw" type="password" autocomplete="new-password" minlength="8" maxlength="200" ' +
          'value="' + esc(S.pay.newPw) + '" placeholder="' + esc(T.password) + '"></label>' + say('password') + '</div>' : '') +
        '<p class="tf-pw-why">' + esc(T.accountWhy) + '</p>' +
      '</div>';
  }

  /* A way to ask us, with the basket in the message: the design, the add-ons,
     and who is asking (contact-context.js adds those on press). */
  function askLink() {
    var sup = S.st && S.st.support;
    if (!sup || !sup.whatsapp) return '';
    var href = 'https://wa.me/' + String(sup.whatsapp).replace(/\D/g, '') + '?text=' +
      encodeURIComponent('Hi! I have a question about my ' + S.st.template.name + ' order.');
    return '<a class="tf-code-link" style="margin-left:14px" href="https://ceremoniainvites.com/try/'&#32;+&#32;esc(href)&#32;+&#32;'" target="_blank" rel="noopener">' + svg('chat') + T.ask + '</a>';
  }

  /* Ordering on WhatsApp instead of paying here. /js/contact-context.js
     adds their names, the design, the plan and total, and a view-only link
     to their card to the message when it is pressed. */
  function orderWaLink() {
    var sup = S.st && S.st.support;
    if (!sup || !sup.whatsapp) return '';
    var href = 'https://wa.me/' + String(sup.whatsapp).replace(/\D/g, '') + '?text=' +
      encodeURIComponent('Hi! I would like to order my ' + S.st.template.name + ' card on WhatsApp.');
    return '<a class="tf-wa-order" href="https://ceremoniainvites.com/try/'&#32;+&#32;esc(href)&#32;+&#32;'" target="_blank" rel="noopener">' + svg('chat') + 'Order on WhatsApp instead</a>';
  }

  function payFoot() {
    var q = S.pay.quote;
    if (!q) return '';
    var label = S.pay.notice === 'exists' ? T.continue : (esc(T.pay) + ' &middot; ' + esc(q.totalText));
    return '<button type="button" class="tf-btn" id="tfPay" data-act="pay-go">' + svg('lock') + label + '</button>';
  }

  function bindPay() { /* delegated in onClick */ }

  /* InitiateCheckout: going on from the price sheet into checkout, the
     first step that is more than looking. Once per design per visit -- going
     back and pressing again is the same checkout, not a second one. */
  function initiated(ev) {
    if (!ev) return;
    if (recall('ic', S.key)) return;
    remember('ic', S.key, '1');
    try {
      if (ev.pixelId && ev.event && window.fbq) window.fbq('track', ev.event, ev.data || {});
      if (ev.gaId && ev.gaEvent && window.gtag) window.gtag('event', ev.gaEvent, ev.gaData || {});
    } catch (e) { /* measuring must never get in the way */ }
  }

  function payGo() {
    if (S.busy || !S.pay.quote) return;
    if (S.pay.notice === 'exists' && !S.pay.password) { later(function () { var f = $('#tfExistingPw'); if (f) f.focus(); }, 10); return; }
    if (needsAccount() && S.pay.notice !== 'exists') {
      var errs = {};
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((S.pay.email || '').trim())) errs.email = 'invalid';
      if (needsNewPw() && (S.pay.newPw || '').length < 8) errs.password = S.pay.newPw ? 'short' : 'required';
      if (Object.keys(errs).length) {
        S.pay.errors = errs;
        keepScroll(paint);
        later(function () { var f = $(errs.email ? '#tfPayEmail' : '#tfPayPw'); if (f) f.focus(); }, 30);
        return;
      }
    }
    S.pay.error = ''; S.pay.passwordErr = ''; S.pay.errors = {};
    busy(true);
    api('/try/api/pay', { key: S.key, tier: S.pay.tier, setup: S.pay.setup ? '1' : '0', code: S.pay.code.trim(), loginCode: S.pay.password,
      email: needsAccount() ? (S.pay.email || '').trim() : '', password: needsAccount() ? (S.pay.newPw || '') : '' }).then(function (r) {
      if (r.ok && r.redirect) { initiated(r.transfer && r.transfer.initiate); leave(r.redirect); return; }
      busy(false);
      if (r.error === 'account') {
        // The email or the password, refused by the server: said beside it.
        S.pay.errors = r.errors || {};
      } else if (r.error === 'account-exists') {
        // First time this email comes back as somebody's account: ask for the
        // password right here, without losing anything else on the screen.
        S.pay.notice = 'exists';
      } else if (r.error === 'wrong-password') {
        S.pay.notice = 'exists'; S.pay.passwordErr = 'bad'; S.pay.password = '';
      } else if (r.error === 'too-many-attempts') {
        S.pay.notice = 'exists'; S.pay.error = r.message || T.slow;
      } else if (r.error === 'admin-email') {
        // The admin's address is never a buyer's: say so, and let them go back
        // and change it.
        S.pay.notice = ''; S.pay.password = ''; S.pay.error = r.message || T.trouble;
      } else if (r.error === 'start') { leave(r.redirect || ('/try/' + S.key)); return; }
      else if (r.error === 'payments-unavailable') S.pay.error = T.unavailable;
      else if (r.error === 'no-price') S.pay.error = T.noPrice;
      else S.pay.error = r.error === 'slow-down' ? T.slow : T.trouble;
      keepScroll(paint);
    });
  }

  /* ------------------------------------------------------------------ hooks */
  /* In the capture phase, on purpose. The homepage's Quick Look is a React
     dialog that stops clicks inside it from travelling any further, so a
     listener waiting for them on the way back up would never hear the one
     button that matters most. */
  /* Only on a press, never on a hover: asking for the state can start a draft
     for that design, and moving over a shelf of them is not a choice. */
  document.addEventListener('pointerdown', function (e) {
    if (e.button) return;
    var a = e.target.closest && e.target.closest('[data-try], [data-try-edit], [data-try-pay], [data-buy]');
    if (a) prefetch(a.getAttribute('data-try') || a.getAttribute('data-try-edit') || a.getAttribute('data-try-pay') || a.getAttribute('data-buy'));
  }, true);

  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest('[data-try], [data-try-pay], [data-try-edit], [data-buy]');
    if (!a) return;
    e.preventDefault();
    /* Buy now, from anywhere, is the two-step buy page: what it costs and
       where to send it, then the receipt (2026-10-04, Ahmad). A card they have
       already tried with their own names goes with them -- the page reads the
       same draft. */
    if (a.hasAttribute('data-try-pay')) {
      var payKey = a.getAttribute('data-try-pay');
      var payAtc = addToCart(a, payKey);
      return goSoon('/buy/' + encodeURIComponent(payKey) + '?tier=' + encodeURIComponent(recall('tier', payKey) || 'none') + (recall('setup', payKey) === '1' ? '&setup=1' : '') + '&atc=' + payAtc);
    }
    if (a.hasAttribute('data-buy')) {
      var buyKey = a.getAttribute('data-buy');
      track('buy_now', { item_id: buyKey, pack: a.getAttribute('data-tier') || 'none' });
      var buyAtc = addToCart(a, buyKey);
      return goSoon('/buy/' + encodeURIComponent(buyKey) + '?tier=' + encodeURIComponent(a.getAttribute('data-tier') || 'none') + '&atc=' + buyAtc);
    }
    if (a.hasAttribute('data-try-edit')) return open(a.getAttribute('data-try-edit'), { edit: true });
    open(a.getAttribute('data-try'), {
      page: a.hasAttribute('data-try-page'),
      colors: colorsOf(a),
      tier: a.getAttribute('data-tier') || ''
    });
  }, true);

  /* The colour they chose on the design's own page or in Quick Look, if they
     chose one. Read off the button that opened this, or failing that off the
     "open full view" link the shop keeps pointed at their choice. */
  function colorsOf(a) {
    var p = a.getAttribute('data-primary'), s2 = a.getAttribute('data-secondary');
    if (!p) {
      var fv = document.querySelector('[data-full-view]');
      if (fv) {
        try { var u = new URL(fv.href, location.href); p = u.searchParams.get('primary'); s2 = u.searchParams.get('secondary'); } catch (e) { /* no colour */ }
      }
    }
    return p && s2 ? { primary: p, secondary: s2 } : null;
  }

  window.TryFlow = { open: open, openPay: openPay, close: close };
})();

</script>
  <script>
    (function () {
      if (!window.TryFlow) return;
      /* /try/<design>?buy=1&tier=<plan> is Buy now: the same questions, then
         payment. The plan is checked by the server when it is priced. */
      var q = new URLSearchParams(location.search);
      var tier = /^[a-z]{2,12}$/.test(q.get('tier') || '') ? q.get('tier') : '';
      window.TryFlow.open("rewind", { page: true, buy: q.get('buy') === '1', tier: tier });
    })();
  </script>
<script data-from="/js/contact-context.js">/* Every "message us" button says who is asking.

   The buttons across the shop, the popup and the preview -- WhatsApp and email
   alike -- open with one short line ("Hi! I have a question about my Elegant
   Wedding preview."), so whoever answers has to begin by asking who it is,
   which card, what they chose. This adds the rest when the button is pressed:
   their names, email and number, the design, the add-ons in their basket with
   prices, their functions, and a view-only link to their own card.

   The text is built by the server (GET /try/api/context) from what THIS
   browser has told us -- its own draft, or the account it is signed into --
   and fetched ahead of time and kept, because a link has to be rewritten the
   instant it is pressed and there is no waiting for a network in a click.
   Where there is nothing to add (a first-time visitor who has told us nothing)
   the links are left exactly as they were.

   Only wa.me and mailto: links are touched. Anything already rewritten is
   rewritten from its original, never twice. */
(function () {
  'use strict';
  if (window.CIContext) return;

  var text = '';
  var design = '';

  function store(name) { try { return sessionStorage.getItem(name) || ''; } catch (e) { return ''; } }

  /* Which design the page is about: the address says so on the design pages
     and the try pages; anywhere else, the last one looked at. */
  function keyNow() {
    var m = /^\/(?:templates|try|preview)\/([a-z0-9-]+)/i.exec(location.pathname);
    if (m && m[1] !== 'api' && m[1] !== 'peek' && m[1] !== 'resume') return m[1];
    return store('tf:last');
  }

  function refresh(opts) {
    opts = opts || {};
    var key = opts.key || keyNow();
    var q = [];
    if (key) {
      q.push('key=' + encodeURIComponent(key));
      var tier = opts.tier !== undefined ? opts.tier : store('tf:tier:' + key);
      var setup = opts.setup !== undefined ? opts.setup : store('tf:setup:' + key);
      var code = opts.code !== undefined ? opts.code : store('tf:code:' + key);
      if (tier) q.push('tier=' + encodeURIComponent(tier));
      if (setup) q.push('setup=' + (setup === '1' || setup === true ? '1' : '0'));
      if (code) q.push('code=' + encodeURIComponent(code));
    }
    return fetch('/try/api/context' + (q.length ? '?' + q.join('&') : ''), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (j) { text = (j && j.ok && j.text) || ''; design = (j && j.design) || ''; return text; })
      .catch(function () { return text; });
  }

  function details() { return '\n\n— My details —\n' + text; }

  function rewrite(a) {
    var original = a.getAttribute('data-ci-original');
    if (original === null) { original = a.getAttribute('href') || ''; a.setAttribute('data-ci-original', original); }

    var wa = /^(https?:\/\/wa\.me\/\d+)(?:\?text=(.*))?$/i.exec(original);
    if (wa) {
      var said = '';
      try { said = decodeURIComponent((wa[2] || '').replace(/\+/g, ' ')); } catch (e) { said = wa[2] || ''; }
      a.setAttribute('href', wa[1] + '?text=' + encodeURIComponent((said || 'Hi!') + details()));
      return;
    }

    var mail = /^mailto:([^?]*)(?:\?(.*))?$/i.exec(original);
    if (mail) {
      var params = new URLSearchParams(mail[2] || '');
      var body = params.get('body') || 'Hi!';
      if (!params.get('subject')) params.set('subject', design ? 'Question about ' + design : 'Question about my invitation');
      params.set('body', body + details());
      // URLSearchParams writes spaces as +, which a mail app shows literally.
      a.setAttribute('href', 'mailto:' + mail[1] + '?' + params.toString().replace(/\+/g, '%20'));
    }
  }

  /* Capture phase, for the same reason as the popup's own hook: some of the
     places these buttons live (Quick Look) stop clicks from travelling up. */
  document.addEventListener('click', function (e) {
    if (!text) return;
    var a = e.target.closest && e.target.closest('a[href^="https://wa.me/"], a[href^="http://wa.me/"], a[href^="mailto:"], a[data-ci-original]');
    if (a) rewrite(a);
  }, true);

  window.CIContext = {
    refresh: refresh,
    get text() { return text; }
  };

  // Once the page has settled: it is not needed until somebody presses a button.
  if (document.readyState === 'complete') refresh();
  else window.addEventListener('load', function () { setTimeout(refresh, 200); });
})();

</script>
